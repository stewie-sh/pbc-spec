name: Reference Tooling CI

on:
  pull_request:
    paths:
      - "cli/**"
      - "viewer/**"
      - "examples/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths:
      - "cli/**"
      - "viewer/**"
      - "examples/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: reference-tooling-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: CLI tests and validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate shipped examples
        run: npm run dev -- validate ../examples/

  viewer:
    name: Viewer build and example sync
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Install viewer dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check synchronized examples
        working-directory: .
        run: git diff --exit-code -- viewer/public/examples
